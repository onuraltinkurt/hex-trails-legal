
  <!DOCTYPE html>
  <html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — Hex Trails</title>
    <style>
      body { font-family: -apple-system, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; color: #222; background: #fafafa; }
      h1 { color: #333; }
      .email { font-size: 1.1em; background: #fff; padding: 10px 14px; border-radius: 6px; display: inline-block; text-decoration: none; color: #2d91be; }
      form { background: #fff; padding: 20px; border-radius: 6px; margin-top: 20px; }
      label { display: block; margin-top: 12px; font-weight: 500; }
      input, textarea { width: 100%; padding: 10px; margin-top: 4px; border: 1px solid #ccc; border-radius: 4px; font-size: 1em; box-sizing: border-box; }
      textarea { min-height: 120px; }
      button { margin-top: 16px; padding: 12px 20px; background: #2d91be; color: #fff; border: none; border-radius: 4px; font-size: 1em; cursor: pointer; }
    </style>
  </head>
  <body>
    <h1>Contact Hex Trails</h1>
    <p>Have feedback, a bug report, or a question? Reach us at:</p>
    <p><a href="mailto:hextrailsgame@gmail.com" class="email">hextrailsgame@gmail.com</a></p>
    <p>Or send a message using the form:</p>
    <form action="https://formsubmit.co/hextrailsgame@gmail.com" method="POST">
      <input type="hidden" name="_captcha" value="true">
      <input type="hidden" name="_subject" value="Hex Trails — Contact form">
      <label>Your Name</label>
      <input type="text" name="name" required>
      <label>Your Email</label>
      <input type="email" name="email" required>
      <label>Message</label>
      <textarea name="message" required></textarea>
      <button type="submit">Send Message</button>
    </form>
  </body>
  </html>
